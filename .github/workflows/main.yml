name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system libs
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-17-jdk autoconf libtool pkg-config wget

      - name: Download unpack cmdline‑tools
        run: |
          mkdir -p ~/dl
          cd ~/dl
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mkdir -p ~/android-sdk/cmdline-tools
          mv ./cmdline-tools ~/android-sdk/cmdline-tools/latest
          rm -rf ~/dl
          ls -la ~/android-sdk/cmdline-tools/latest/bin

      # 手动生成许可文件，绕过交互式y/n确认
      - name: Pre‑create android SDK license
        run: |
          mkdir -p ~/android-sdk/licenses
          echo "84831b9409646a918e30573bab4c9c9f346d8abd" > ~/android-sdk/licenses/android-sdk-license
          echo "d975f751698a77b662f1254ddbeed3901f976f5a" > ~/android-sdk/licenses/android-sdk-preview-license

      - name: Install SDK packages
        run: |
          ~/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root="$HOME/android-sdk" "build-tools;34.0.0" "platforms;android-33"

      - name: Copy SDK to buildozer folder
        run: |
          mkdir -p ~/.buildozer/android/platform/
          cp -r ~/android-sdk ~/.buildozer/android/platform/android-sdk

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: output-apk
          path: bin/*.apk
