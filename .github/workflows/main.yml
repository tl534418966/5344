name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build_apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: $HOME/android-sdk
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system libs
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-17-jdk autoconf libtool pkg-config wget unzip

      - name: Download Android command‑line tools
        run: |
          mkdir -p ~/android-sdk/cmdline-tools
          cd ~/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mv cmdline-tools latest
          ls -la ~/android-sdk/cmdline-tools/latest/bin

      - name: Install SDK components
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "build-tools;37.0.0" "platforms;android-33"

      - name: Copy SDK to buildozer expected folder
        run: |
          mkdir -p ~/.buildozer/android/platform/
          cp -r "$ANDROID_SDK_ROOT" ~/.buildozer/android/platform/android-sdk

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: output-apk
          path: bin/*.apk
