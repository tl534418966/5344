name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build_apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: $HOME/android-sdk
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system libs
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-17-jdk autoconf libtool pkg-config wget

      - name: Download and unpack cmdline‑tools
        run: |
          mkdir -p ~/dl
          cd ~/dl
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          ls -la
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv ./* $ANDROID_SDK_ROOT/cmdline-tools/latest/
          cd /
          rm -rf ~/dl
          ls $ANDROID_SDK_ROOT/cmdline-tools/latest/bin

      - name: Install SDK packages
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --accept-licenses "build-tools;34.0.0" "platforms;android-33"

      - name: Copy SDK to buildozer folder
        run: |
          mkdir -p ~/.buildozer/android/platform/
          cp -r "$ANDROID_SDK_ROOT" ~/.buildozer/android/platform/android-sdk

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: output-apk
          path: bin/*.apk

      - name: Install SDK packages
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --accept-licenses "build-tools;34.0.0" "platforms;android-33"

      - name: Copy SDK to buildozer folder
        run: |
          mkdir -p ~/.buildozer/android/platform/
          cp -r "$ANDROID_SDK_ROOT" ~/.buildozer/android/platform/android-sdk

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: output-apk
          path: bin/*.apk
